<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGA Vistas · Protótipo</title>
<style>
:root{
  --black:#020203;--forest:#183509;--olive:#548b0a;--lime:#79d900;--mint:#d3f8d3;
  --green:#1f420c;--green-h:#2b5a10;--ink:#141d0f;--sidebar:#10260a;--side-hover:#1b3a10;--side-active:#24491a;
  --muted:#626d5c;--bg:#f3f6f0;--line:#e1e8dc;--soft:#eef8ea;--soft-2:#f7faf4;
  --amber:#7a5414;--amber-bg:#fbf4e4;--red:#a33131;--red-bg:#fdf0ef;--blue:#2f5f82;--blue-bg:#eef4f9;
  --radius:16px;--side:260px
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #8fd63a;outline-offset:3px}
input:focus,select:focus{outline:2px solid var(--olive);outline-offset:1px}
h1,h2,h3,p{margin:0}
h2{font-size:19px;letter-spacing:-.3px}
h3{font-size:15px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--olive)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.hidden{display:none!important}
.icon{width:19px;height:19px;flex-shrink:0;vertical-align:middle;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 15px;border-radius:8px;background:#fff;border:1px solid #cbd8c3;color:var(--green);font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.primary:hover{background:var(--green-h)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--forest)}
.btn.lime:hover{background:#86e80f}
.btn.quiet{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 11px;font-size:12px}
.btn .icon{width:17px;height:17px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--green)}
.link-btn{white-space:nowrap;background:transparent;color:var(--green);font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:6px 4px}
.link-btn:hover{text-decoration:underline}
.link-btn .icon{width:16px;height:16px}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--green);line-height:1.6;white-space:nowrap}
.tag .icon{width:13px;height:13px}
.tag.lime{background:#e3f9c9;color:#2c5207}
.tag.gray{background:#f0f2ee;color:var(--muted)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.dark{background:var(--forest);color:#e9fbd7}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ===== barra lateral (padrão SIGATIC) ===== */
.sidebar{position:fixed;z-index:40;inset:0 auto 0 0;width:var(--side);background:var(--sidebar);color:#eff5ec;display:flex;flex-direction:column;box-shadow:5px 0 18px #13280a10}
.brand{display:flex;gap:10px;align-items:center;height:76px;padding:0 24px;text-decoration:none;color:#fff}
.brand img{width:45px;height:40px;object-fit:contain;filter:brightness(1.25)}
.brand b{font-size:23px;letter-spacing:.8px}
.side-content{padding:24px 15px;position:relative;z-index:1}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#93ad85;padding:0 15px;margin-bottom:10px}
.nav-item{color:#d2e1ca;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:12px 15px;margin:5px 0;border-radius:9px;font-weight:500;position:relative}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-active);color:#fff}
.nav-item.active:before{content:"";position:absolute;width:3px;background:var(--lime);height:26px;left:0;border-radius:3px}
.nav-item small{margin-left:auto;font-size:11px;font-weight:700;background:var(--lime);color:var(--forest);border-radius:20px;padding:0 7px;line-height:18px}
.nav-item.disabled{color:#7f9873;cursor:default}
.nav-item.disabled:hover{background:transparent}
.nav-item.disabled em{margin-left:auto;font-style:normal;font-size:9px;letter-spacing:.8px;text-transform:uppercase;border:1px solid #3d5a31;border-radius:4px;padding:0 5px}
.side-sep{height:1px;background:#264019;margin:18px 15px}
.watermark{width:170px;height:160px;object-fit:contain;position:absolute;bottom:76px;left:44px;filter:grayscale(1) brightness(1.6);opacity:.12;pointer-events:none}
.side-bottom{margin-top:auto;padding:20px 26px;font-size:11px;color:#91ac83;position:relative;z-index:1}

/* topo */
.topbar{position:fixed;top:0;left:var(--side);right:0;height:76px;background:var(--sidebar);color:#fff;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:20px}
.topbar .icon-btn{color:#dbe7d4}
.topbar .icon-btn:hover{background:var(--side-hover);color:#fff}
.crumb-top{color:#a1b996;font-size:12px}
.crumb-top strong{font-weight:500;color:#eef6ea}
.user{position:relative}
.user-btn{display:flex;gap:11px;align-items:center;background:transparent;color:#fff;text-align:left;padding:6px 8px;border-radius:10px}
.user-btn:hover{background:var(--side-hover)}
.avatar{width:36px;height:36px;border:1px solid #7a9a6a;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#e3f7d0}
.user b{font-size:12px;display:block}
.user small{color:#a2bb95;font-size:10px;display:block}
.user-menu{position:absolute;right:0;top:52px;width:260px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px #10260a26;padding:8px;display:none}
.user-menu.open{display:block}
.user-menu .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:8px 10px 4px}
.user-menu button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--ink)}
.user-menu button:hover{background:var(--soft)}
.user-menu button .check{margin-left:auto;color:var(--olive);visibility:hidden}
.user-menu button.on .check{visibility:visible}
.user-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.main{margin-left:var(--side);padding:106px 34px 36px;max-width:1900px}
.page-footer{margin-top:22px;display:flex;justify-content:space-between;gap:15px;color:#86917f;font-size:10px;flex-wrap:wrap}
.mobile-veil{display:none}
.collapsible .sidebar{transform:translateX(-100%)}
.collapsible .topbar{left:0}
.collapsible .main{margin-left:0}

/* ===== padrão de quadros sobrepostos (painel) ===== */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;background:transparent;margin-bottom:14px;padding:0}
.backlink:hover{color:var(--green)}
.dash-hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#efe2cb}
.dash-hero.tall{min-height:390px}
.dash-scene{position:absolute;inset:0}
.dash-scene svg{width:100%;height:100%;display:block}
.dash-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,252,245,.97) 0%,rgba(248,252,245,.9) 36%,rgba(248,252,245,.35) 62%,rgba(248,252,245,0) 82%);pointer-events:none}
.dash-hero-inner{position:relative;z-index:1;padding:32px 36px 62px;display:flex;flex-direction:column;gap:22px}
.dash-hero.tall .dash-hero-inner{min-height:390px}
.dash-hero-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.dash-headline h1{font-size:38px;line-height:1.12;letter-spacing:-1.1px;color:var(--forest);font-weight:750}
.dash-headline p{font-size:15px;color:#3e5236;margin-top:10px;max-width:560px;line-height:1.5}
.dash-headline .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.dash-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.95);border-radius:11px;padding:0 13px;height:42px;color:var(--forest);box-shadow:0 4px 14px #10260a14;font-size:12px;font-weight:600;white-space:nowrap}
.dash-pill .icon{width:17px;height:17px}
.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:20px 24px 22px;box-shadow:0 10px 30px #10260a17}
.glass-title{display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px;margin-bottom:16px}
.coin{width:30px;height:30px;border-radius:50%;background:#e1f5cb;color:#3c6a09;display:grid;place-items:center;flex-shrink:0}
.coin .icon{width:17px;height:17px}
.glass-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:auto}
.glass-row .glass{padding:18px 20px}
.kv{display:grid;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted)}
.kv b{font-size:14px;font-weight:650;overflow-wrap:anywhere}
.kv b.num{white-space:nowrap;overflow-wrap:normal}
.kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.dash-place{position:absolute;right:22px;bottom:42px;color:#fff;font-size:11px;display:flex;gap:5px;align-items:center;z-index:1;background:rgba(16,38,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:3px 9px;border-radius:7px}
.dash-place .icon{width:14px;height:14px}
.dash-sheet{position:relative;z-index:2;margin:-30px 12px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 22px 24px;box-shadow:0 -6px 24px #10260a10;display:grid;gap:26px}
.dash-sheet>*{min-width:0}
.dash-sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.dash-sec-head h2{display:flex;align-items:center;gap:10px}
.dash-sec-head h2 .icon{color:var(--olive);width:23px;height:23px}
.dash-sec-head p{font-size:12px;color:var(--muted);margin-top:3px}
.panel{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:#fff}

/* busca */
.search-card{max-width:760px;margin-top:auto}
.seg{display:inline-flex;border:1px solid #cfdcc7;background:#fff;border-radius:9px;padding:3px;gap:3px}
.seg button{border-radius:6px;background:transparent;color:var(--muted);font-size:12px;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--forest);color:#fff}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:#33482a}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #cad7c2;border-radius:8px;color:var(--ink);background:#fff;min-height:42px;font-size:13px}
.input-icon{position:relative}
.input-icon .icon{position:absolute;left:12px;top:12px;width:17px;height:17px;color:var(--muted)}
.input-icon input{padding-left:38px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hint .icon{width:14px;height:14px}
.hint button{background:transparent;color:var(--olive);font-weight:700;padding:0;font-size:11px;text-decoration:underline}
.alert{display:flex;gap:10px;border-radius:10px;font-size:12px;padding:11px 14px;background:var(--red-bg);color:var(--red);border:1px solid #f0d2cf;margin-top:14px}
.note{display:flex;gap:10px;background:var(--blue-bg);border:1px solid #d8e5ee;border-radius:10px;color:#36586f;font-size:12px;padding:12px 14px}
.note.amber{background:var(--amber-bg);color:var(--amber);border-color:#efe2c4}
.note.lime{background:var(--soft);color:#2e4d1b;border-color:#d6ecc9}
.note .icon{margin-top:1px;width:17px;height:17px}

/* cartões de atalho */
.tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;color:var(--ink);box-shadow:0 2px 8px #10260a08;transition:transform .15s,border-color .15s}
.tile:hover{border-color:#b6d0a6;transform:translateY(-1px)}
.tile-icon{width:46px;height:46px;border-radius:50%;display:grid!important;place-items:center;flex-shrink:0;background:#e3f7cd;color:#3d6c09}
.tile-icon .icon{width:23px;height:23px}
.tile b{font-size:13px;display:block;font-weight:650}
.tile small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* tabela */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{position:relative;flex:1;min-width:220px}
.toolbar .search .icon{position:absolute;left:12px;top:11px;width:16px;color:var(--muted)}
.toolbar .search input{padding:9px 12px 9px 37px;border:1px solid #cfdac8;border-radius:8px;width:100%;font-size:13px;height:40px}
.toolbar select{border:1px solid #cfdac8;border-radius:8px;color:var(--ink);padding:0 10px;font-size:12px;background:#fff;height:40px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;padding:11px 14px;background:var(--soft-2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.65px;font-weight:650;border-bottom:1px solid var(--line);white-space:nowrap}
th button{background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
th button .icon{width:13px;height:13px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfdf9}
tbody tr.sel{background:#f4fbec}
tbody tr.off td:not(:first-child):not(:last-child){opacity:.62}
td.chk,th.chk{width:44px;padding-right:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--olive);cursor:pointer}
input[type=checkbox]:disabled{cursor:not-allowed}
.doc-cell{display:flex;gap:11px;align-items:center;min-width:260px}
.ext{width:36px;height:40px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.4px;flex-shrink:0;border:1px solid}
.ext.pdf{background:#fdf0ef;color:#a33131;border-color:#f3d6d3}
.ext.xls{background:#e6f6de;color:#2f6a12;border-color:#cbe8bb}
.ext.doc{background:#eaf2fa;color:#2f5f82;border-color:#d3e3f0}
.ext.img{background:#f7f1e3;color:#7a5414;border-color:#eee0c0}
.ext.zip{background:#f0f2ee;color:#5b6555;border-color:#e0e5dc}
.ext.geo{background:#e8f1f6;color:#2f5f82;border-color:#cfe0eb}
.doc-cell b{font-size:13px;font-weight:600;display:block;line-height:1.35}
.doc-cell small{font-size:11px;color:var(--muted);display:block}
.cell-sub{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.nowrap{white-space:nowrap}
.lock{display:inline-flex;align-items:center;gap:5px;color:var(--amber);font-size:11px;font-weight:600}
.lock .icon{width:14px;height:14px}
.table-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:12px;gap:10px;flex-wrap:wrap}

/* barra de seleção */
.selbar{position:sticky;bottom:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--forest);color:#eaf8de;border-radius:14px;padding:12px 14px 12px 20px;box-shadow:0 12px 30px #10260a40;flex-wrap:wrap}
.selbar b{font-size:20px;color:#fff;margin-right:4px}
.selbar .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center}
.selbar .facts span{display:inline-flex;gap:6px;align-items:center}
.selbar .facts .icon{width:15px;height:15px;color:var(--lime)}
.selbar .btn.quiet{color:#cfe6c2}
.selbar .btn.quiet:hover{background:#ffffff14}

/* requerimentos do processo */
.req-list{display:grid;gap:8px}
.req-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.7);border:1px solid #e3ecdc;border-radius:10px;padding:10px 12px}
.req-item .num{font-weight:750;font-size:14px;color:var(--forest);min-width:82px}
.req-item .txt{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.req-item .txt b{color:var(--ink);font-weight:600}

/* objeto */
.obj-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.obj-card{border:1px solid var(--line);border-radius:13px;padding:14px 15px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px #10260a08}
.obj-card .tile-icon{width:40px;height:40px}
.obj-card .tile-icon .icon{width:20px;height:20px}
.obj-card div>span{font-size:11px;color:var(--muted);display:block}
.obj-card{align-items:center}
.obj-card b{font-size:13px;font-weight:650;display:block;line-height:1.35;margin-top:2px}

/* dossiês */
.job{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:20px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.job + .job{margin-top:10px}
.job h3{font-size:14px}
.job small{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.bar{height:7px;border-radius:9px;background:#e3eadf;overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive);border-radius:9px;transition:width .25s}
.bar.done i{background:var(--lime)}
.bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.empty{text-align:center;padding:42px 15px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .tile-icon{margin:0 auto 12px}

/* gaveta e modal */
.scrim{position:fixed;inset:0;background:#0a1a0580;backdrop-filter:blur(3px);z-index:100;display:none}
.scrim.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:-12px 0 40px #0a1a0520;display:flex;flex-direction:column}
.d-head{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:15px;justify-content:space-between}
.d-head h2{font-size:20px}
.d-head p{font-size:12px;color:var(--muted);margin-top:5px}
.d-body{overflow:auto;padding:22px 26px;flex:1}
.d-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:grid;gap:4px;margin-top:18px}
.step{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:9px;font-size:12px}
.step .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#eef2ea;color:var(--muted)}
.step .st .icon{width:14px;height:14px}
.step.run{background:var(--soft)}
.step.run .st{background:var(--olive);color:#fff}
.step.ok .st{background:#e1f6c9;color:#3a6a08}
.step.warn .st{background:var(--amber-bg);color:var(--amber)}
.step.err .st{background:var(--red-bg);color:var(--red)}
.step .tx{flex:1;min-width:0}
.step .tx b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .tx small{color:var(--muted);font-size:11px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.modal{position:fixed;inset:24px;margin:auto;max-width:1180px;background:#fff;border-radius:18px;box-shadow:0 24px 60px #0a1a0540;display:flex;flex-direction:column;overflow:hidden}
.m-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.m-head h2{font-size:17px}
.m-head p{font-size:12px;color:var(--muted)}
.m-body{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.m-body.single{grid-template-columns:minmax(0,1fr)}
.outline{border-right:1px solid var(--line);overflow:auto;padding:14px 10px;background:var(--soft-2)}
.outline .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:2px 10px 8px}
.outline button{width:100%;display:flex;gap:9px;align-items:flex-start;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--ink)}
.outline button:hover{background:var(--soft)}
.outline button.on{background:#e3f6cf}
.outline button .pg{margin-left:auto;color:var(--muted);font-size:11px;padding-left:6px}
.outline button .ic{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--olive)}
.outline button.fail .ic{color:var(--red)}
.viewer{overflow:auto;background:#5d6758;padding:26px 18px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.m-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* páginas simuladas */
.page{background:#fff;width:min(560px,100%);aspect-ratio:1/1.414;box-shadow:0 6px 20px #00000040;position:relative;padding:7% 8%;display:flex;flex-direction:column;font-size:11px;color:#222}
.page.land{width:min(760px,100%);aspect-ratio:1.414/1}
.page .pfoot{position:absolute;bottom:3.2%;left:0;right:0;text-align:center;font-size:9px;color:#888}
.page h4{margin:0 0 4px;font-size:13px}
.page .ln{height:6px;border-radius:3px;background:#e4e6e2;margin:7px 0}
.page .ln.s{width:62%}.page .ln.m{width:82%}
.page .stamp{margin-top:auto;border:1px solid #c7d6bd;background:#f6fbf1;border-radius:6px;padding:8px 10px;font-size:9px;color:#3b5a27;align-self:flex-end;max-width:62%}
.page .ph{flex:1;border-radius:6px;background:linear-gradient(135deg,#cfe9b4,#7bb53a 60%,#3f6d18);display:grid;place-items:center;color:#fff;margin-top:10px}
.page .ph .icon{width:44px;height:44px;stroke-width:1.3}
.page table{font-size:8.5px;margin-top:8px}
.page table th,.page table td{padding:4px 5px;border:1px solid #dfe5da;text-transform:none;letter-spacing:0;font-size:8.5px;color:#333;background:#fff}
.page table th{background:#eef6e6;font-weight:700}
.cover{padding:0}
.cover .ctop{color:#e9fbd7;background:var(--forest);padding:12% 8% 9%}
.cover .cbody{flex:1;display:flex;flex-direction:column;padding:8% 8% 9%}
.cover .ctop small{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lime);font-weight:700}
.cover .ctop h3{font-size:22px;margin:6px 0 4px;color:#fff;letter-spacing:-.4px}
.cover .ctop p{font-size:10px;color:#cfe5c1}
.cover dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.cover dt{font-size:8.5px;color:#777;text-transform:uppercase;letter-spacing:.6px}
.cover dd{margin:2px 0 0;font-size:10.5px;font-weight:600}
.cover .cbot{margin-top:auto;border-top:1px solid #e3e8df;padding-top:8px;font-size:8.5px;color:#777;display:flex;justify-content:space-between}
.toc-row{display:flex;gap:8px;font-size:9.5px;padding:4px 0;border-bottom:1px dotted #d8ddd4}
.toc-row span:first-child{width:56px;color:#777}
.toc-row span:nth-child(2){flex:1}
.toc-row.fail span:nth-child(2){color:var(--red)}
.subst{margin:auto 0;border:1px dashed #d9b8b4;background:#fdf6f5;border-radius:8px;padding:18px;text-align:center}
.subst.info{border-color:#cdd5c8;background:#f7f9f5}
.subst .icon{width:30px;height:30px;color:var(--red);margin-bottom:6px}
.subst.info .icon{color:var(--muted)}
.subst h4{font-size:13px}
.subst p{font-size:10px;color:#555;margin-top:4px}
.blocked{margin:auto;max-width:420px;text-align:center;color:#eef3ea}
.blocked .icon{width:42px;height:42px;color:var(--lime);margin-bottom:10px}
.blocked p{font-size:13px;color:#cfdac8;margin-top:6px}

/* login */
.auth .sidebar,.auth .topbar{display:none}
.auth .main{margin:0;padding:0;max-width:none}
.auth .page-footer{display:none}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#fff}
.login-art{position:relative;background:var(--sidebar);color:#fff;overflow:hidden;padding:44px;display:flex;flex-direction:column}
.login-art .scene{position:absolute;inset:0}
.login-art .scene svg{width:100%;height:100%}
.login-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,38,10,.15) 0%,rgba(16,38,10,0) 30%,rgba(16,38,10,.55) 62%,rgba(16,38,10,.92) 100%)}
.login-art>*{position:relative;z-index:1}
.login-art .brand{padding:0;height:auto}
.login-art h1{font-size:40px;line-height:1.1;letter-spacing:-1px;margin-top:auto;max-width:460px}
.login-art p{color:#cfe2c3;margin-top:12px;max-width:440px;font-size:15px}
.login-art .wm{position:absolute;right:-30px;bottom:-30px;width:300px;opacity:.08;filter:grayscale(1) brightness(1.6);z-index:1}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.login-card{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 30px #10260a10}
.login-card h2{font-size:22px}
.demo-users{display:grid;gap:8px;margin-top:6px}
.demo-user{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink)}
.demo-user:hover{background:var(--soft);border-color:#c6dcb7}
.demo-user .avatar{border-color:#bcd3ad;color:var(--forest);background:#fff}
.demo-user b{font-size:13px;display:block}
.demo-user small{font-size:11px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:18px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

.toast{position:fixed;bottom:25px;left:calc(var(--side) + (100vw - var(--side))/2);transform:translateX(-50%);z-index:120;background:var(--forest);color:#fff;box-shadow:0 8px 26px #10260a30;padding:12px 20px;border-radius:9px;font-size:13px;display:none;max-width:90vw}
.toast.show{display:block}

/* submenu, abas e formulários de configuração */
.subnav{margin:2px 0 8px 30px;border-left:1px solid #34502a;padding-left:9px}
.subnav .nav-item{padding:9px 14px;font-size:13px;margin:2px 0}
.subnav.closed{display:none}
.nav-chev{margin-left:auto;width:16px;height:16px;opacity:.7;transition:transform .15s}
#aud-toggle[aria-expanded=false] .nav-chev{transform:rotate(-90deg)}
.tabs{display:flex;overflow:auto;gap:24px;border-bottom:1px solid var(--line);margin:-4px 0 4px;scrollbar-width:thin}
.tab{border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:12px 0 11px;white-space:nowrap;font-size:13px;display:flex;gap:7px;align-items:center;font-weight:600}
.tab .icon{width:16px;height:16px}
.tab.active{color:var(--forest);border-bottom-color:var(--olive)}
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cfg-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.cfg-row:first-of-type{border-top:0;padding-top:4px}
.cfg-row b{font-size:13px;font-weight:650;display:block}
.cfg-row small{font-size:11px;color:var(--muted);display:block;margin-top:2px;max-width:520px}
.cfg-row select,.cfg-row input[type=number],.cfg-row input[type=password]{border:1px solid #cfdac8;border-radius:8px;height:38px;padding:0 10px;font-size:13px;background:#fff;color:var(--ink);min-width:150px}
.cfg-row input[type=number]{width:110px;min-width:0}
.switch{position:relative;width:40px;height:23px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:#cfd8c9;border-radius:20px;transition:background .15s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px #0003}
.switch input:checked+i{background:var(--olive)}
.switch input:checked+i:before{transform:translateX(17px)}
.switch input:focus-visible+i{outline:3px solid #8fd63a;outline-offset:2px}
.radio-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.radio-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:#fff}
.radio-card:has(input:checked){border-color:#9fca7c;background:var(--soft)}
.radio-card input{accent-color:var(--olive);margin-top:3px}
.radio-card b{font-size:13px;display:block}
.radio-card small{font-size:11px;color:var(--muted)}
.integ{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:16px}
.integ .tile-icon{width:42px;height:42px}
.integ .tile-icon .icon{width:20px;height:20px}
.integ h3{font-size:14px}
.integ p{font-size:12px;color:var(--muted);margin-top:2px}
.integ .row{margin-top:10px}
.st-ok{color:#2f6a12}.st-warn{color:var(--amber)}.st-off{color:var(--muted)}
.perm{text-align:center}
.perm .icon{width:16px;height:16px;color:var(--olive)}
.perm .no{color:#c3cbbd}
.save-bar{position:sticky;bottom:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--forest);color:#eaf8de;border-radius:14px;padding:12px 14px 12px 20px;box-shadow:0 12px 30px #10260a40;flex-wrap:wrap;font-size:13px}
.save-bar .btn.quiet{color:#cfe6c2}
.save-bar .btn.quiet:hover{background:#ffffff14}
/* auditoria */
.nav-lock{margin-left:auto;width:15px;height:15px;color:#93ad85}
.dash-pill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:0 2px;cursor:pointer;height:100%}
.dash-pill select:focus{outline:none}
.stat{font-size:30px;font-weight:750;letter-spacing:-.6px;line-height:1.1;color:var(--ink)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.chk-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid #cfdac8;border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.ev{display:inline-flex;align-items:center;gap:6px}
.ev .icon{width:14px;height:14px}
tr.sig td:first-child{box-shadow:inset 3px 0 0 #d9a441}
.kv-list{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.doc-mini{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.doc-mini:first-child{border-top:0}
.doc-mini .ext{width:30px;height:34px;font-size:8px}
.doc-mini>span:not(.ext):not(.lock){flex:1;min-width:0}
.doc-mini .ext{flex:none}
/* responsivo */
@media(min-width:1700px){:root{--side:300px}.main{padding-left:45px;padding-right:45px}.watermark{left:59px}}
@media(max-width:1250px){.obj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1150px){:root{--side:225px}.main{padding-left:23px;padding-right:23px}.brand{padding-left:20px}.brand b{font-size:21px}.watermark{left:32px;width:160px}.user small{display:none}.glass-row{grid-template-columns:1fr 1fr}.glass-row .glass:last-child{grid-column:1/-1}}
@media(max-width:1050px){.dash-hero-top{flex-direction:column}.dash-hero:after{background:linear-gradient(180deg,rgba(248,252,245,.94) 0%,rgba(248,252,245,.82) 50%,rgba(248,252,245,.4) 100%)}.job{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-art{min-height:300px}.m-body{grid-template-columns:1fr}.outline{display:none}}
@media(max-width:820px){:root{--side:0px}.sidebar{width:260px;transform:translateX(-100%);transition:transform .18s}.topbar{left:0;height:65px;padding:0 17px}.main{margin-left:0;padding:86px 17px 25px}.brand{height:65px}.mobile-open .sidebar{transform:translateX(0)}.mobile-open .mobile-veil{display:block;position:fixed;inset:0;background:#0a1a0566;z-index:35}.toast{left:50%}.collapsible .sidebar{transform:translateX(-100%)}.collapsible.mobile-open .sidebar{transform:translateX(0)}.modal{inset:10px}}
@media(max-width:820px){.cfg-grid,.radio-cards{grid-template-columns:1fr}}
@media(max-width:640px){.dash-headline h1{font-size:27px}.dash-headline p{font-size:14px}.dash-hero-inner{padding:22px 16px 56px}.glass{padding:16px}.glass-row,.field-grid,.kv-grid,.obj-grid,.tile-grid{grid-template-columns:1fr}.glass-row .glass:last-child{grid-column:auto}.dash-sheet{margin:-24px 4px 0;padding:16px}.dash-place{bottom:38px;right:14px}.topbar .user b,.topbar .crumb-top{display:none}.selbar{bottom:8px}.d-head,.d-body,.d-foot{padding-left:18px;padding-right:18px}.login-art{padding:28px}.login-art h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const navAt=ui.view==='detalhe'?'consulta':ui.view==='auditoria'?'aud-'+ui.audTipo:ui.view;
  document.querySelectorAll('.nav-item[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===navAt));
  document.querySelectorAll('[data-lock]').forEach(l=>l.classList.toggle('hidden',!ui.user||pode(l.dataset.lock==='config'?'config':'aud-'+l.dataset.lock)));
  const n=ui.jobs.length,jc=$('#jobs-count');jc.textContent=n;jc.classList.toggle('hidden',!n);
  const crumbs={consulta:'Consulta',detalhe:ui.alvo?`${ident(REQS[ui.alvo.chave]).rot} ${ident(REQS[ui.alvo.chave]).num}`:'',dossies:'Dossiês gerados',auditoria:ui.audTipo==='doc'?'Auditoria / <strong>Documentos':'Auditoria / <strong>Acessos',config:'Configurações'};
  $('#crumbs').innerHTML=ui.view==='detalhe'?`Vistas do Processo / Consulta / <strong>${e(crumbs.detalhe)}</strong>`:(ui.view==='auditoria'?`Vistas do Processo / ${crumbs.auditoria}</strong>`:`Vistas do Processo / <strong>${crumbs[ui.view]||''}</strong>`);

  $('#app').innerHTML=({login:vLogin,consulta:vConsulta,detalhe:vDetalhe,dossies:vDossies,auditoria:vAuditoria,config:vConfig}[ui.view])();
}
function renderUser(){
  const u=ui.user;if(!u){$('#user').innerHTML='';return;}
  $('#user').innerHTML=`<button class="user-btn" onclick="toggleUserMenu(event)" aria-haspopup="true" aria-expanded="${ui.menu}"><span class="avatar">${u.ini}</span><span><b>${e(u.nome)}</b><small>${perfilNome(u.perfil)}</small></span>${icon('down')}</button>
  <div class="user-menu ${ui.menu?'open':''}" onclick="event.stopPropagation()"><div class="label">Perfil simulado</div>
  ${Object.entries(USERS).map(([k,x])=>`<button class="${x.perfil===u.perfil?'on':''}" onclick="trocarPerfil('${k}')">${icon(x.perfil==='OPERADOR_SIGILO'?'lock':x.perfil==='ADMIN'?'settings':'user')}<span>${e(x.nome)}<br><small class="muted">${e(x.desc)}</small></span>${icon('check','check')}</button>`).join('')}
  <hr><button onclick="logout()">${icon('logout')}Sair</button></div>`;
}

/* ---------- consulta ---------- */
function vConsulta(){
  const f=ui.form;

  </div>
  <form class="glass search-card" onsubmit="buscar(event)"><div class="glass-title"><span class="coin">${icon('search')}</span>Informe um ou mais critérios de pesquisa</div>
   <div class="field-grid">
    <div class="field full"><label>Pesquisar por</label><div class="row wrap"><div class="seg" role="radiogroup" aria-label="Tipo de pesquisa">
      <button type="button" role="radio" aria-checked="${ui.tipo==='REQ'}" class="${ui.tipo==='REQ'?'on':''}" onclick="ui.tipo='REQ';render()">Requerimento</button>
      <button type="button" role="radio" aria-checked="${ui.tipo==='PROC'}" class="${ui.tipo==='PROC'?'on':''}" onclick="ui.tipo='PROC';render()">Processo</button></div>
      <div class="input-icon" style="flex:1;min-width:200px">${icon('plan')}<input id="f-num" inputmode="numeric" placeholder="Número do ${ui.tipo==='REQ'?'requerimento':'processo'} (ex.: ${ui.tipo==='REQ'?'3331/2025':'2825/2025'})" value="${e(f.numero)}" oninput="ui.form.numero=mascNum(this)" aria-label="Número"></div></div></div>
    <div class="field"><label for="f-doc">CPF/CNPJ do interessado</label><input id="f-doc" inputmode="numeric" placeholder="000.000.000-00 ou 00.000.000/0000-00" value="${e(f.doc)}" oninput="ui.form.doc=mascDoc(this)"></div>
    <div class="field"><label for="f-nome">Nome do interessado</label><input id="f-nome" placeholder="Parte do nome" value="${e(f.nome)}" oninput="ui.form.nome=this.value"></div>
   </div>
   ${restritoAVinculo()?`<p class="hint" style="margin-top:12px">${icon('info')} Seu perfil consulta apenas processos e requerimentos em que você é o interessado.</p>`:''}
   <div class="form-actions"><button class="btn primary" type="submit">${icon('search')}Consultar</button><button class="btn" type="button" onclick="limpar()">Limpar</button></div>
   ${ui.erro?`<div class="alert" role="alert">${icon('alert')}<span>${e(ui.erro)}</span></div>`:''}
  </form></div><span class="dash-place">${icon('pin')}Cachoeira Véu de Noiva · Chapada dos Guimarães - MT</span></div>
  <div class="dash-sheet">${ui.resultados?secResultados():secInicio()}</div></section>`;

function secInicio(){
  const rec=['3331/2025','1187/2026','904/2026'].map(k=>REQS[k]).filter(vinculado);
  return `<section><div class="dash-sec-head"><div><h2>${icon('clock')}Consultados recentemente</h2><p>${restritoAVinculo()?'Somente processos e requerimentos em que você é o interessado.':'Atalhos de demonstração para o protótipo.'}</p></div></div>
  <div class="tile-grid">${rec.map(tileReq).join('')}</div></section>
  <section class="panel"><div class="dash-sec-head" style="margin-bottom:12px"><h2>${icon('sparkle')}O que muda em relação à Vista atual</h2></div>
  <div class="tile-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
   ${[['convert','Planilhas e textos no PDF','XLS, XLSX, DOCX e imagens são convertidos e entram no dossiê.'],['layers','Todas as origens','Documentos pessoais, taxas, juntadas, pareceres e titulações aparecem na lista.']].map(([i,t,d])=>`<div class="tile" style="cursor:default"><span class="tile-icon">${icon(i)}</span><span><b>${t}</b><small>${d}</small></span></div>`).join('')}
  </div></section>`;
}
const ident=r=>r.processo?{rot:'Processo',num:r.processo}:{rot:'Requerimento',num:r.numero};
function tileReq(r){const s=SITUACAO[r.situacao];return `<button class="tile" onclick="abrir('${r.numero}')"><span class="tile-icon">${icon('license')}</span><span><b>${ident(r).rot} ${ident(r).num}</b><small>${e(r.interessado)} · ${e(r.tipoProcesso)}</small><span class="meta"><span class="tag ${s[1]}">${s[0]}</span>${r.processo?'':'<span class="tag gray">Não protocolado</span>'}</span></span></button>`;}

function secResultados(){
  const rs=ui.resultados;
  return `<section><div class="dash-sec-head"><div><h2>${icon('search')}Resultados da consulta</h2><p>${rs.length} resultado(s). Selecione um para abrir.</p></div><button class="link-btn" onclick="ui.resultados=null;render()">${icon('close')}Fechar resultados</button></div>
  ${rs.length?`<div class="table-wrap"><table><thead><tr><th>Número</th><th>Interessado</th><th>Tipo de processo</th><th>Situação</th><th>Abertura</th><th></th></tr></thead><tbody>
  ${rs.map(r=>{const s=SITUACAO[r.situacao];return `<tr><td class="nowrap"><b>${ident(r).num}</b><span class="cell-sub">${r.processo?'Processo':'Requerimento · não protocolado'}</span></td><td>${e(r.interessado)}<span class="cell-sub">${r.doc}</span></td><td>${e(r.tipoProcesso)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td class="nowrap">${dt(r.abertura)}</td><td style="text-align:right"><button class="btn sm" onclick="abrir('${r.numero}')">Abrir${icon('arrow')}</button></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty"><span class="tile-icon">${icon('search')}</span><h3>Nenhum resultado encontrado</h3><p>Revise os critérios informados.</p></div>`}</section>`;
}
function mascNum(el){let v=el.value.replace(/[^\d]/g,'').slice(0,10);if(v.length>4)v=v.slice(0,v.length-4)+'/'+v.slice(-4);el.value=v;return v;}
function mascDoc(el){let d=el.value.replace(/\D/g,'').slice(0,14),v;
  if(d.length<=11)v=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  else v=d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
  el.value=v;return v;}
function limpar(){ui.form={numero:'',doc:'',nome:''};ui.erro='';ui.resultados=null;render();}
function exemplo(t,v){ui.erro='';if(t==='NOME'){ui.form={numero:'',doc:'',nome:v};ui.tipo='REQ';}else{ui.tipo=t;ui.form={numero:v,doc:'',nome:''};}render();buscar();}
function buscar(ev){ev&&ev.preventDefault();const f=ui.form;ui.erro='';ui.resultados=null;
  if(!f.numero&&!f.doc&&!f.nome){ui.erro='Informe ao menos um critério de pesquisa.';return render();}
  if(f.numero&&!f.doc&&!f.nome){
    if(!/^\d{1,6}\/\d{4}$/.test(f.numero)){ui.erro='Informe o número no formato N/AAAA.';return render();}
    const alvo=ui.tipo==='REQ'?REQS[f.numero]:Object.values(REQS).find(r=>r.processo===f.numero),rot=ui.tipo==='REQ'?'Requerimento':'Processo';
    if(!alvo){ui.erro=`${rot} ${f.numero} não encontrado.`;return render();}
    if(!vinculado(alvo)){ui.erro=`${rot} ${f.numero} não tem você como interessado.`;return render();}
    return abrir(alvo.numero);}
  const dg=f.doc.replace(/\D/g,''),nm=f.nome.trim().toLowerCase();
  ui.resultados=Object.values(REQS).filter(r=>vinculado(r)&&(!dg||r.doc.replace(/\D/g,'').includes(dg))&&(!nm||r.interessado.toLowerCase().includes(nm))&&(!f.numero||(ui.tipo==='REQ'?r.numero===f.numero:r.processo===f.numero)));
  render();}

/* ---------- detalhe ---------- */
function abrir(chave){if(!vinculado(REQS[chave]))return toast('Você não é o interessado deste processo ou requerimento.');ui.alvo={chave};audit('CONSULTA',{alvo:ident(REQS[chave]),det:'Abertura do detalhe'});ui.f={q:'',ori:''};ui.sort={k:'data',dir:1};ui.sel=new Set(docsAlvo().filter(d=>d.situacao==='VIGENTE'&&selecionavel(d)).map(d=>d.key));ui.view='detalhe';render();scrollTo(0,0);}
function reqAlvo(){return REQS[ui.alvo.chave];}
function docsAlvo(){return DOCS.filter(d=>d.req===ui.alvo.chave&&CFG.origens[d.origem]!==false&&!isGeo(d.ext)&&!ignorado(d.ext));}
function geoAlvo(){return DOCS.filter(d=>d.req===ui.alvo.chave&&CFG.origens[d.origem]!==false&&isGeo(d.ext)&&d.situacao==='VIGENTE');}
function docsFiltrados(){const f=ui.f,q=f.q.trim().toLowerCase(),k=ui.sort.k,dir=ui.sort.dir;
  return docsAlvo().filter(d=>(!q||(d.titulo+' '+d.arquivo+' '+d.id).toLowerCase().includes(q))&&(!f.ori||d.origem===f.ori))
   .sort((a,b)=>{const va=k==='data'?a.data:k==='titulo'?a.titulo:ORIGEM[a.origem][0],vb=k==='data'?b.data:k==='titulo'?b.titulo:ORIGEM[b.origem][0];return (va<vb?-1:va>vb?1:a.id-b.id)*dir;});}
function tarefaGlass(t){return `<div class="glass"><div class="glass-title"><span class="coin">${icon('flow')}</span>Tarefa atual</div>
  ${t?`<div class="kv-grid"><div class="kv" style="grid-column:1/-1"><span>Tarefa</span><b>${e(t.nome)}</b></div><div class="kv"><span>Desde</span><b>${dth(t.desde)}</b></div><div class="kv"><span>Responsável</span><b>${e(t.responsavel)}</b></div></div>`
  :`<p class="muted" style="font-size:13px">Sem tarefa ativa. A instância pode estar encerrada ou o requerimento ainda não foi enviado ao fluxo.</p>`}</div>`;}
function vDetalhe(){
  const r=reqAlvo(),docs=docsAlvo(),s=SITUACAO[r.situacao],o=r.objeto;
  const hero=`<div class="dash-hero-top"><div class="dash-headline"><span class="eyebrow">${ident(r).rot} · ${e(r.tipoReq)}</span><h1 style="margin-top:6px">${ident(r).num}</h1>
     <p>${e(r.interessado)} · ${e(r.tipoProcesso)}</p><div class="tags"><span class="tag ${s[1]}"><span class="dot"></span>${s[0]}</span><span class="tag blue">${icon('check')}${e(r.prioridade)}</span>${r.processo?'':'<span class="tag amber">Não protocolado</span>'}</div></div></div>
     <div class="glass-row"><div class="glass"><div class="glass-title"><span class="coin">${icon('building')}</span>Interessado</div><div class="kv-grid"><div class="kv" style="grid-column:1/-1"><span>Nome</span><b>${e(r.interessado)}</b></div><div class="kv"><span>CPF/CNPJ</span><b class="num">${r.doc}</b></div><div class="kv"><span>Município</span><b>${e(r.municipio)}</b></div></div></div>
     <div class="glass"><div class="glass-title"><span class="coin">${icon('calendar')}</span>Datas</div><div class="kv-grid"><div class="kv"><span>Abertura</span><b>${dt(r.abertura)}</b></div><div class="kv"><span>Última atualização</span><b>${dt(r.atualizacao)}</b></div>${r.processo?`<div class="kv"><span>Nº do requerimento</span><b>${r.numero}</b></div>`:`<div class="kv"><span>Tipo</span><b>${e(r.tipoReq)}</b></div>`}<div class="kv"><span>Documentos</span><b>${docs.length}</b></div></div></div>
     ${tarefaGlass(r.tarefa)}</div>`;
  return `<button class="backlink" onclick="go('consulta')">${icon('left')}Voltar para a consulta</button>
  <section><div class="dash-hero"><div class="dash-scene" aria-hidden="true">${cachoeira('D')}</div><div class="dash-hero-inner">${hero}</div><span class="dash-place">${icon('pin')}Cachoeira Véu de Noiva · Chapada dos Guimarães - MT</span></div>
  <div class="dash-sheet">
   <section><div class="dash-sec-head"><h2>${icon('leaf')}Objeto do requerimento</h2></div><div class="obj-grid">
    ${[['drop','Objetivo',o.objetivo],['bars','Finalidade',o.finalidade],['building','Atividade',o.atividade],['layers','Tipo',o.tipo]].map(([i,l,v])=>`<div class="obj-card"><span class="tile-icon">${icon(i)}</span><div><span>${l}</span><b>${e(v)}</b></div></div>`).join('')}
   </div></section>
   ${secGeo()}
   <section id="docs">${secDocs()}</section>
  </div></section>`;
}
function secGeo(){const g=geoAlvo();if(!g.length)return '';
  return `<section class="panel"><div class="dash-sec-head"><div><h2>${icon('pin')}Geometrias</h2><p>Arquivos SHP e KML não entram no dossiê em PDF. Baixe-os à parte.</p></div><button class="btn sm primary" onclick="baixarGeo()">${icon('download')}Baixar geometrias (${g.length})</button></div>
   <div>${g.map(d=>`<div class="doc-mini"><span class="ext geo">${d.ext.toUpperCase()}</span><span><b style="font-weight:600">${e(d.titulo)}</b><br><small class="muted">${e(d.arquivo)} · ${e(ORIGEM[d.origem][0])} · ${dt(d.data)}</small></span></div>`).join('')}</div></section>`;}
function baixarGeo(){const g=geoAlvo(),r=reqAlvo(),id=ident(r),arq=`geometrias-${id.rot.toLowerCase()}-${id.num.replace('/','-')}.zip`;
  audit('DOWNLOAD',{alvo:id,det:`Geometrias · ${g.length} arquivo(s)`,arquivo:arq,docs:g.map(d=>({titulo:d.titulo,arquivo:d.arquivo,ext:d.ext,sigiloso:d.sigiloso}))});toast(`Protótipo: download de ${arq} simulado.`);}
function secDocs(){
  const lista=docsFiltrados(),todos=docsAlvo(),selv=lista.filter(selecionavel),all=selv.length&&selv.every(d=>ui.sel.has(d.key));
  const sb=(k,l)=>`<button onclick="ordenar('${k}')">${l}${ui.sort.k===k?icon(ui.sort.dir>0?'up':'down'):''}</button>`;
  const r=reqAlvo();
  return `<div class="dash-sec-head"><div><h2>${icon('plan')}Documentos ${r.processo?'do processo':'do requerimento'}</h2><p>${todos.length} documentos de todas as origens.</p></div>
   <div class="row wrap"><button class="btn sm" onclick="selVigentes()">${icon('refresh')}Seleção padrão</button><button class="btn sm quiet" onclick="ui.sel.clear();refreshDocs()">Limpar seleção</button></div></div>
  <div class="toolbar"><div class="search">${icon('search')}<input placeholder="Buscar por nome, arquivo ou ID" value="${e(ui.f.q)}" oninput="ui.f.q=this.value;refreshDocs(true)" aria-label="Buscar documentos"></div>
   <select aria-label="Origem" onchange="ui.f.ori=this.value;refreshDocs()"><option value="">Todas as origens</option>${[...new Set(todos.map(d=>d.origem))].map(v=>`<option value="${v}" ${ui.f.ori===v?'selected':''}>${ORIGEM[v][0]}</option>`).join('')}</select></div>
  <div class="table-wrap"><table><thead><tr><th class="chk"><input type="checkbox" aria-label="Selecionar todos os listados" ${all?'checked':''} ${selv.length?'':'disabled'} onchange="selTodos(this.checked)"></th>
   <th>${sb('titulo','Documento')}</th><th>${sb('origem','Origem')}</th><th>${sb('data','Data')}</th><th>Sigilo</th><th></th></tr></thead><tbody>
  ${lista.map(linhaDoc).join('')||`<tr><td colspan="6"><div class="empty"><h3>Nenhum documento com esses filtros</h3></div></td></tr>`}
  </tbody></table></div>
  <div class="table-foot"><span>Exibindo ${lista.length} de ${todos.length} · ordem ${ui.sort.k==='data'&&ui.sort.dir>0?'cronológica':'personalizada'}</span><span>Data usada: assinatura, quando houver; senão, data do registro.</span></div>
  ${selBar()}`;
}
function linhaDoc(d){
  const sel=ui.sel.has(d.key),ok=selecionavel(d),ac=acessivel(d),ind=d.situacao==='INDISPONIVEL';
  const xc=extClass(d.ext);
  return `<tr class="${sel?'sel':''} ${ind?'off':''}"><td class="chk"><input type="checkbox" aria-label="Selecionar ${e(d.titulo)}" ${sel?'checked':''} ${ok?'':'disabled'} onchange="toggleSel('${d.key}')"></td>
   <td><div class="doc-cell"><span class="ext ${xc}">${d.ext.toUpperCase()}</span><span><b>${e(d.titulo)}</b><small>ID ${d.id} · ${e(d.arquivo)}${ind?' · arquivo indisponível':precisaConv(d.ext)?' · será convertido':semConv(d.ext)?' · página informativa':''}</small></span></div></td>
   <td class="nowrap">${e(ORIGEM[d.origem][0])}</td>
   <td class="nowrap">${dt(d.data)}<span class="cell-sub">${new Date(d.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></td>
   <td>${d.sigiloso?`<span class="lock">${icon('lock')}Sigiloso</span>${ac?'':'<span class="cell-sub">Requer perfil autorizado</span>'}`:'<span class="muted">Não</span>'}</td>
   <td style="text-align:right"><button class="icon-btn" aria-label="Visualizar ${e(d.titulo)}" title="${ac?(ind?'Arquivo indisponível':'Visualizar'):'Requer perfil autorizado'}" ${ac&&!ind?'':'disabled'} onclick="verDoc('${d.key}')">${icon('eye')}</button></td></tr>`;
}
function selBar(){
  const s=docsAlvo().filter(d=>ui.sel.has(d.key)),conv=s.filter(d=>precisaConv(d.ext)).length,pg=s.reduce((a,d)=>a+d.paginas,0);
  return `<div class="selbar"><div class="facts"><span><b>${s.length}</b> selecionado(s)</span><span>${icon('convert')}${conv} para converter</span><span>${icon('plan')}~${pg+2} páginas</span></div>
  <div class="row"><button class="btn lime" ${s.length?'':'disabled'} onclick="gerar()">${icon('layers')}Gerar dossiê</button></div></div>`;
}
function refreshDocs(keepFocus){const a=document.activeElement,pos=a&&a.selectionStart;$('#docs').innerHTML=secDocs();if(keepFocus){const i=$('#docs .search input');i.focus();i.setSelectionRange(pos,pos);}}

  else if(xc==='zip')body=`<div class="subst info">${icon('package')}<h4>Arquivo sem representação em PDF</h4><p><b>${e(d.titulo)}</b><br>${e(d.arquivo)} · formato ${d.ext.toUpperCase()} · ${dt(d.data)}</p><p style="margin-top:8px">O arquivo original permanece disponível no SIGA.</p></div>`;
  else if(xc==='xls')body=`<h4>${e(d.titulo)}</h4><div style="font-size:8.5px;color:#777">Aba ${n} de ${d.paginas} · ${CFG.planilha==='largura'?'ajustada à largura da página':'uma página por aba'}</div><table><thead><tr>${['Data','Hora','Nível estático (m)','Nível dinâmico (m)','Vazão (m³/h)','Rebaixamento (m)','Condutividade','pH','Temperatura (°C)','Observação'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${Array.from({length:12},(_,i)=>`<tr><td>${String(i+1).padStart(2,'0')}/03/2025</td><td>${8+i%9}:00</td><td>${(12.4+i*.07).toFixed(2)}</td><td>${(31.8+i*.31).toFixed(2)}</td><td>${(18.2-i*.12).toFixed(1)}</td><td>${(19.4+i*.24).toFixed(2)}</td><td>${212+i*3}</td><td>${(6.8+(i%3)*.1).toFixed(1)}</td><td>${(27.1+(i%4)*.2).toFixed(1)}</td><td>${i%5===0?'Coleta':'—'}</td></tr>`).join('')}</tbody></table>`;
  else if(xc==='img')body=`<h4>${e(d.titulo)}</h4><div style="font-size:8.5px;color:#777">${e(d.arquivo)} · imagem ajustada à página</div><div class="ph">${icon('image')}</div>`;
  else body=`<h4>${e(d.titulo)}${d.paginas>1?` <span style="font-weight:400;color:#888;font-size:10px">(${n}/${d.paginas})</span>`:''}</h4><div style="font-size:8.5px;color:#777">${e(d.arquivo)}</div>${Array.from({length:15},(_,i)=>`<div class="ln ${i%4===3?'s':i%3===2?'m':''}"></div>`).join('')}${d.assinado&&n===d.paginas?`<div class="stamp">${icon('check')} ${e(d.assinado)}</div>`:''}`;
  return `<div class="page ${land?'land':''}" id="pg-${num}">${body}<div class="pfoot">${total?`Página ${num} de ${total}`:''}</div></div>`;
}

/* ---------- geração ---------- */
function gerar(){criarJob(ui.alvo.chave,docsAlvo().filter(d=>ui.sel.has(d.key)).map(d=>d.key));}
function criarJob(chave,keys){
  const docs=DOCS.filter(d=>keys.includes(d.key)).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:a.id-b.id);
  const r=REQS[chave],proc=!!r.processo,num=proc?r.processo:r.numero;
  const job={id:'D'+String(ui.jobs.length+1).padStart(3,'0'),alvo:{chave},titulo:`${proc?'Processo':'Requerimento'} ${num}`,sub:proc?'':'Não protocolado',interessado:r.interessado,docs:docs.map(d=>({...d,_st:'pend',_falha:null})),
    criado:new Date(),status:'PROCESSANDO',feitos:0,erro:null,arquivo:`dossie-${proc?'processo':'requerimento'}-${num.replace('/','-')}.pdf`};
  job.expira=new Date(job.criado.getTime()+CFG.ttl*60000);
  ui.jobs.unshift(job);render();drawer(job);run(job);
}
function tentarNovamente(id){const j=ui.jobs.find(x=>x.id===id);closeLayer();criarJob(j.alvo.chave,j.docs.map(d=>d.key));}
function removerEGerar(id){const j=ui.jobs.find(x=>x.id===id),k=j.erro.key;ui.sel.delete(k);closeLayer();criarJob(j.alvo.chave,j.docs.filter(d=>d.key!==k).map(d=>d.key));}
function drawer(job){ui.drawerJob=job.id;
  const done=job.status==='CONCLUIDO',fail=job.status==='FALHA',pct=Math.round(job.feitos/job.docs.length*100);
  const st={pend:['clock',''],baixando:['refresh','run'],convertendo:['convert','run'],ok:['check','ok'],info:['info','warn'],falha:['alert','err'],cancel:['close','']};
  const lbl=d=>({pend:'Aguardando',baixando:'Obtendo arquivo…',convertendo:`Convertendo ${d.ext.toUpperCase()} para PDF…`,ok:precisaConv(d.ext)?`Convertido de ${d.ext.toUpperCase()}`:'Incluído',info:'Página informativa (formato sem PDF)',falha:d._falha,cancel:'Não processado'})[d._st];
  const titulo=done?'Dossiê pronto':fail?'Geração interrompida':'Gerando dossiê';
  openLayer(`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t"><header class="d-head"><div><span class="eyebrow">${job.id} · ${e(job.titulo)}</span><h2 id="dr-t" style="margin-top:4px">${titulo}</h2><p>${job.docs.length} documentos em ordem cronológica · capa e sumário com marcadores.</p></div><button class="icon-btn" aria-label="Fechar" title="${done||fail?'Fechar':'Fechar (a geração continua)'}" onclick="closeLayer()">${icon('close')}</button></header>
  <div class="d-body">
   ${fail?`<div class="alert" role="alert" style="margin:0 0 16px">${icon('alert')}<span><b>${e(job.erro.titulo)}</b> não pôde ser incluído: ${e(job.erro.motivo)}.<br>A geração foi interrompida e nenhum arquivo foi gerado, para não entregar um dossiê incompleto.</span></div>`:''}
   <div class="bar-lbl"><span>${done?'Concluído':fail?'Interrompido':'Processando'} · ${job.feitos}/${job.docs.length}</span><b>${pct}%</b></div><div class="bar ${done?'done':''}"><i style="width:${pct}%;${fail?'background:var(--red)':''}"></i></div>
   ${done?`<div class="note lime" style="margin-top:12px">${icon('clock')}<span>O arquivo fica disponível até ${job.expira.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} e depois é descartado.</span></div>`:''}
   <div class="steps">${job.docs.map(d=>{const[s,c]=st[d._st];return `<div class="step ${c}"><span class="st">${icon(s,c==='run'?'spin':'')}</span><span class="tx"><b>${e(d.titulo)}</b><small>${dt(d.data)} · ${e(lbl(d))}</small></span></div>`;}).join('')}</div></div>
  <footer class="d-foot">${fail?`<button class="btn quiet" onclick="removerEGerar('${job.id}')">Remover documento e gerar</button><button class="btn primary" onclick="tentarNovamente('${job.id}')">${icon('refresh')}Tentar novamente</button>`
   :`<button class="btn quiet" ${done?'':'disabled'} onclick="closeLayer();go('dossies')">Ver dossiês gerados</button><div class="row"><button class="btn" ${done?'':'disabled'} onclick="preview('${job.id}')">${icon('eye')}Pré-visualizar</button><button class="btn primary" ${done?'':'disabled'} onclick="baixar('${job.id}')">${icon('download')}Baixar PDF</button></div>`}</footer></section>`);
}
function run(job){
  let i=0,fase=0;const r=REQS[job.alvo.chave];
  const fim=()=>{if(ui.view==='dossies'&&!$('#scrim.open'))render();if(ui.drawerJob===job.id)drawer(job);updateCount();};
  const tick=()=>{const d=job.docs[i];
    if(!d){job.status='CONCLUIDO';const ns=job.docs.filter(x=>x.sigiloso).length;
      audit('DOSSIE',{alvo:ident(r),det:`${job.docs.length} documentos · ${ns} sigiloso(s)`,sigilo:ns>0,arquivo:job.arquivo,docs:job.docs.map(x=>({titulo:x.titulo,arquivo:x.arquivo,ext:x.ext,sigiloso:x.sigiloso}))});return fim();}
    if(fase===0){d._st='baixando';fase=1;}
    else if(fase===1){const orig=DOCS.find(x=>x.key===d.key);
      if(d.falha&&!orig._tentou){orig._tentou=true;d._st='falha';d._falha=d.falha;job.status='FALHA';job.erro={key:d.key,titulo:d.titulo,motivo:d.falha.charAt(0).toLowerCase()+d.falha.slice(1)};
        job.docs.slice(i+1).forEach(x=>x._st='cancel');job.feitos=i;
        audit('FALHA',{alvo:ident(r),det:`Interrompida em “${d.sigiloso?'Documento sigiloso':d.titulo}”: ${job.erro.motivo}`,sigilo:d.sigiloso,docs:[{titulo:d.titulo,arquivo:d.arquivo,ext:d.ext,sigiloso:d.sigiloso}]});return fim();}
      else if(semConv(d.ext)){d._st='info';next();}else if(precisaConv(d.ext)){d._st='convertendo';fase=2;}else{d._st='ok';next();}}
    else{d._st='ok';next();}
    if(ui.drawerJob===job.id)drawer(job);if(ui.view==='dossies'&&!$('#scrim.open'))render();setTimeout(tick,fase===2?650:260);};
  const next=()=>{i++;fase=0;job.feitos=i;};
  tick();
}
function updateCount(){const jc=$('#jobs-count');jc.textContent=ui.jobs.length;jc.classList.toggle('hidden',!ui.jobs.length);}
function baixar(id){const j=ui.jobs.find(x=>x.id===id);audit('DOWNLOAD',{alvo:ident(REQS[j.alvo.chave]),det:j.arquivo,arquivo:j.arquivo,sigilo:j.docs.some(d=>d.sigiloso)});if(ui.view==='auditoria')render();toast(`Protótipo: download de ${j.arquivo} simulado.`);}

function mudarAtivo(id,v){const u=CFG.usuarios.find(x=>x.id===id);u.ativo=v;
  audit('USUARIO',{det:`${u.nome}: usuário ${v?'reativado':'desativado'}`,mudancas:[[`${u.nome} · situação`,v?'Inativo':'Ativo',v?'Ativo':'Inativo']]});toast(`${u.nome} ${v?'reativado':'desativado'}.`);render();}
function novoUsuario(){openLayer(`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="nu-t"><header class="d-head"><div><span class="eyebrow">Usuários</span><h2 id="nu-t" style="margin-top:4px">Adicionar usuário</h2><p>No protótipo, o cadastro fica apenas nesta página.</p></div><button class="icon-btn" aria-label="Fechar" onclick="closeLayer()">${icon('close')}</button></header>
  <form class="d-body" id="nu-f" onsubmit="salvarUsuario(event)"><div class="field-grid"><div class="field full"><label for="nu-n">Nome</label><input id="nu-n" required placeholder="Nome completo"></div>
   <div class="field full"><label for="nu-l">Login</label><input id="nu-l" required placeholder="nome.sobrenome"></div>
   <div class="field full"><label for="nu-d">CPF/CNPJ</label><input id="nu-d" inputmode="numeric" placeholder="Obrigatório para o perfil Operador" oninput="mascDoc(this)"><small>Para o Operador, define de quais processos ele é o interessado.</small></div>
   <div class="field full"><label for="nu-p">Perfil</label><select id="nu-p">${Object.entries(PERFIS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div>
   <div class="note" style="margin-top:18px">${icon('info')}<span>Os perfis Gestor e Administrador dão acesso a documentos sigilosos e a todos os processos. Conceda apenas com autorização formal.</span></div></form>
  <footer class="d-foot"><button class="btn quiet" onclick="closeLayer()">Cancelar</button><button class="btn primary" type="submit" form="nu-f">${icon('check')}Adicionar</button></footer></section>`);setTimeout(()=>$('#nu-n').focus(),50);}
function salvarUsuario(ev){ev.preventDefault();const nome=$('#nu-n').value.trim(),login=$('#nu-l').value.trim(),perfil=$('#nu-p').value,doc=$('#nu-d').value.trim();if(!nome||!login)return;
  if(perfil==='OPERADOR'&&soDig(doc).length<11)return toast('Informe o CPF/CNPJ do interessado para o perfil Operador.');
  if(CFG.usuarios.some(u=>u.login===login))return toast('Já existe um usuário com esse login.');
  CFG.usuarios.push({id:Math.max(...CFG.usuarios.map(u=>u.id))+1,nome,login,doc,perfil,ativo:true,ultimo:null});
  audit('USUARIO',{det:`${nome}: usuário criado com perfil ${perfilNome(perfil)}`,mudancas:[[`${nome} · cadastro`,'—',`${perfilNome(perfil)} · ativo`]]});closeLayer();render();toast(`${nome} adicionado.`);}
function linha(t,d,ctrl){return `<div class="cfg-row"><div><b>${t}</b>${d?`<small>${d}</small>`:''}</div>${ctrl}</div>`;}
function num(k,min,max,suf){const r=rascunho();return `<div class="row"><input type="number" min="${min}" max="${max}" value="${r[k]}" aria-label="${ROT[k][0]}" onchange="setCfg('${k}',Math.min(${max},Math.max(${min},this.value||${min})))"><span class="muted" style="font-size:12px">${suf}</span></div>`;}
function cfgDossie(){const r=rascunho();
  return `<div class="cfg-grid"><section class="panel"><div class="dash-sec-head"><h2>${icon('clock')}Geração</h2></div>
    ${linha('Expiração do dossiê','Tempo que o PDF gerado fica disponível antes de ser descartado.',num('ttl',5,240,'min'))}
    ${linha('Gerações simultâneas','Quantos dossiês podem ser montados ao mesmo tempo.',num('threads',1,8,''))}
    ${linha('Sumário','Página com a lista de documentos e a página inicial de cada um.',sw(r.sumario,"setCfg('sumario',this.checked)"))}
    ${linha('Marcadores no PDF','Um marcador por documento no painel lateral do leitor de PDF.',sw(r.marcadores,"setCfg('marcadores',this.checked)"))}
    ${linha('Numeração de páginas','“Página X de Y” no rodapé, a partir do sumário.',sw(r.numeracao,"setCfg('numeracao',this.checked)"))}</section>
   <section class="panel"><div class="dash-sec-head"><div><h2>${icon('layers')}Origens dos documentos</h2><p>Origens desligadas não aparecem na lista nem entram no dossiê.</p></div></div>
    ${Object.entries(ORIGEM).map(([k,[l]])=>linha(l,'',sw(r.origens[k],`setOrigem('${k}',this.checked)`))).join('')}</section></div>
   <section class="panel"><div class="dash-sec-head"><h2>${icon('calendar')}Ordem cronológica</h2></div><p class="muted" style="font-size:13px">A data usada para ordenar segue esta prioridade: <b style="color:var(--ink)">data de assinatura</b> › <b style="color:var(--ink)">data do registro no SIGA</b> › <b style="color:var(--ink)">data de cadastro do arquivo</b>. Documentos sem data vão para o final. Regra fixa, informada na capa do dossiê.</p></section>`;}
function cfgConversao(){const r=rascunho();
  return `<div class="cfg-grid"><section class="panel"><div class="dash-sec-head"><h2>${icon('bars')}Planilhas</h2></div>
    <div class="radio-cards"><label class="radio-card"><input type="radio" name="pl" ${r.planilha==='largura'?'checked':''} onchange="setCfg('planilha','largura')"><span><b>Ajustar à largura</b><small>Cada aba cabe na largura da página; as linhas seguem em páginas seguintes.</small></span></label>
     <label class="radio-card"><input type="radio" name="pl" ${r.planilha==='aba'?'checked':''} onchange="setCfg('planilha','aba')"><span><b>Uma página por aba</b><small>Cada aba vira uma única página, do tamanho necessário.</small></span></label></div>
    <div style="margin-top:10px">${linha('Orientação automática','Paisagem quando a área usada da aba for mais larga que alta.',sw(r.paisagem,"setCfg('paisagem',this.checked)"))}
    ${linha('Incluir abas ocultas','Por padrão, abas ocultas não entram no dossiê.',sw(r.ocultas,"setCfg('ocultas',this.checked)"))}</div></section>
   <section class="panel"><div class="dash-sec-head"><h2>${icon('convert')}Tempo limite e formatos</h2></div>
    ${linha('Tempo limite de conversão','Acima disso, o documento vira página com o motivo.',num('tConv',30,600,'s'))}
    <div class="cfg-row"><div><b>Convertidos para PDF</b><small>XLS, XLSX, ODS, DOC, DOCX, ODT, RTF, HTML, PNG, JPG</small></div></div>
    <div class="cfg-row"><div><b>Geometrias</b><small>SHP, KML e KMZ: fora do dossiê, com download à parte (“Baixar geometrias”)</small></div></div>
    <div class="cfg-row"><div><b>Desconsiderados</b><small>ZIP, RAR e 7Z: não aparecem na lista nem entram no dossiê</small></div></div></section></div>`;}
function cfgConexoes(){const I=CFG.integ,horas=Math.max(0,Math.round((I.api.expira-Date.now())/3600e3));
  const st=x=>x.st==='ok'?`<span class="tag lime ev">${icon('check')}Funcionando</span>`:x.st==='erro'?`<span class="tag red ev">${icon('alert')}Falha</span>`:x.st==='teste'?`<span class="tag blue ev">${icon('refresh','spin')}Testando…</span>`:`<span class="tag gray">Desativada</span>`;
  const card=(k,i,t,d,extra='')=>`<div class="integ"><span class="tile-icon">${icon(i)}</span><div style="flex:1;min-width:0"><div class="row wrap" style="margin:0;justify-content:space-between"><h3>${t}</h3>${st(I[k])}</div><p>${d}</p>${extra}<div class="row wrap">${I[k].st!=='off'?`<button class="btn sm" onclick="testar('${k}')">${icon('refresh')}Testar conexão</button>`:''}${I[k].ms&&I[k].st==='ok'?`<span class="muted" style="font-size:11px">Resposta em ${I[k].ms} ms</span>`:''}</div></div></div>`;
  return `<div class="cfg-grid">${card('banco','building','Banco de dados do SIGA','Leitura de requerimentos, documentos e tarefa atual. Usuário somente leitura.')}
   ${card('api','file','Arquivos do Licenciamento','Obtenção dos arquivos pela API de arquivos do Licenciamento.',`<p class="${horas<6?'st-warn':'st-ok'}" style="margin-top:6px">Token de sessão pessoal · expira em ${horas} h</p>`)}
   ${card('pessoal','user','SCORP','Documentos pessoais de interessados, representantes e responsáveis técnicos.')}
   ${card('taxas','coins','Taxas','Guias de taxa do requerimento. Desativada até a forma de obtenção ser confirmada.')}</div>
   <section class="panel"><div class="dash-sec-head"><h2>${icon('clock')}Tempo limite</h2></div>${linha('Tempo limite de download','Por arquivo. Acima disso, o documento vira página com o motivo.',num('tDown',10,300,'s'))}</section>
   <div class="note amber">${icon('info')}<span>No protótipo, as credenciais ficam no arquivo de ambiente do servidor e não são exibidas nem editadas por esta tela.</span></div>`;}
function testar(k){CFG.integ[k].st='teste';render();setTimeout(()=>{CFG.integ[k].st='ok';CFG.integ[k].ms=Math.round(30+Math.random()*300);if(ui.view==='config')render();toast('Conexão verificada.');},900);}
function cfgAuditoria(){
  const sel=k=>{const r=rascunho();return `<select aria-label="${ROT[k][0]}" onchange="setCfg('${k}',this.value)">${Object.entries(RET).map(([v,l])=>`<option value="${v}" ${r[k]===v?'selected':''}>${l}</option>`).join('')}</select>`;};
  return `<section class="panel"><div class="dash-sec-head"><div><h2>${icon('shield')}Retenção</h2><p>Tempo que os eventos são mantidos antes de serem removidos pela rotina de expurgo.</p></div></div>
   ${linha('Auditoria de documentos','Consultas, visualizações, dossiês, falhas e downloads. Gestor e Administrador veem tudo; Operador, só os processos em que é o interessado.',sel('retDoc'))}
   ${linha('Auditoria de acessos','Entradas, alterações de usuários e de configuração. Visível ao perfil Administrador.',sel('retAcesso'))}</section>
   <div class="note">${icon('info')}<span>Eventos são somente inclusão: nenhum perfil altera ou exclui registros pela aplicação. Os prazos ainda serão definidos com a área responsável.</span></div>`;}

render();
</script>
</body>
</html>
