server {
    # Porta acima de 1024: o nginx roda sem root (bloco 5 do CI).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # PDF do dossiê (S2.2, D49): streaming sem buffer (arquivos de centenas de MB) e sem log de acesso, porque o
    # download direto leva o ticket de uso único na URL. O log de erro fica só em "crit" pelo mesmo motivo.
    location ~ ^/api/dossies/[^/]+/arquivo$ {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # Arquivos com hash no nome (main-XXXX.js, styles-XXXX.css, chunk-XXXX.js): cache longo.
    location ~* "-[A-Za-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html e demais arquivos: sempre revalidar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
