<div class="shell">
  <header class="top">
    <a class="logo" routerLink="/consulta" aria-label="SIGRASTRO, início"><app-marca /></a>
    <nav class="nav" aria-label="Principal">
      @for (secao of menu(); track secao.rotulo) {
        @for (item of secao.itens; track item.rotulo) {
          <a [routerLink]="item.rota" [attr.aria-current]="ativo(item) ? 'page' : null">
            <app-icone [nome]="item.icone" /><span>{{ item.rotulo }}</span>
          </a>
        }
      }
    </nav>
    <div class="top-dir">
      <app-indicador-dossie />
      @if (usuario(); as u) {
        <div class="who">
          <span class="perfil-chip">{{ u.perfilDescricao }}</span>
          <span class="who-nome">{{ u.nome }}</span>
          <b class="avatar" aria-hidden="true">{{ iniciais() }}</b>
          <button type="button" class="sair" (click)="sair()">Sair</button>
        </div>
      }
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
  @if (acompanhamento.gavetaAberta()) {
    <app-gaveta-dossie />
  }
</div>
