<section class="login">
  <div class="marca">
    <app-marca />
    <p>Acompanhamento de processos de licenciamento ambiental</p>
  </div>

  <div class="login-card">
    <span class="eyebrow">Acesso</span>
    <h2>Entrar</h2>
    <p class="sub">Informe o seu usuário e a sua senha.</p>

    <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
      <div class="field">
        <label for="login-usuario">Usuário</label>
        <input id="login-usuario" formControlName="usuario" autocomplete="username" autocapitalize="none" />
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" formControlName="senha" autocomplete="current-password" />
      </div>
      @if (erro()) {
        <div class="alert" role="alert">
          <app-icone nome="alert" /><span>{{ erro() }}</span>
        </div>
      }
      <button class="btn primary" type="submit" [disabled]="entrando()"><app-icone nome="arrow" />Entrar</button>
    </form>

    <div class="note amber">
      <app-icone nome="info" /><span
        >O perfil define o que cada usuário pode ver. Quem esqueceu a senha deve procurar o Administrador.</span
      >
    </div>
  </div>
</section>
