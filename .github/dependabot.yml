version: 2

# Mensal (D53): cada PR do Dependabot roda o CI inteiro e consome minutos do plano gratuito. Os alertas e as
# atualizações de segurança do Dependabot não dependem deste agendamento: chegam assim que a falha é publicada.

updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maven-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        update-types: [minor, patch]

  # S8, bloco 6: o servidor MCP (tools/mcp-rastro) também tem package-lock e dependências de produção.
  - package-ecosystem: npm
    directory: /tools/mcp-rastro
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-mcp-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docker-api-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /front
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docker-front-patch-minor:
        update-types: [minor, patch]
