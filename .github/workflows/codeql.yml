name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Preparar o Java (somente para java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@v3.28.18
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build manual da api
        if: matrix.language == 'java-kotlin'
        working-directory: api
        run: ./mvnw -B -DskipTests package
      - name: Analisar
        uses: github/codeql-action/analyze@v3.28.18
        with:
          category: /language:${{ matrix.language }}
