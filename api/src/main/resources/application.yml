spring:
  application:
    name: rastro-api
  autoconfigure:
    # Os datasources são configurados pelo projeto (siga agora; vistas na versão definitiva).
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  jackson:
    time-zone: America/Cuiaba
  task:
    scheduling:
      pool:
        size: 1

server:
  port: 8080
  shutdown: graceful

management:
  health:
    # O SIGA fora do ar não pode deixar a api unhealthy.
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

rastro:
  datasource:
    siga:
      # Vazia = SIGA não configurado: a api sobe e as consultas respondem 503 SIGA_INDISPONIVEL.
      url: ${SIGA_DB_URL:}
      username: ${SIGA_DB_USER:}
      password: ${SIGA_DB_PASSWORD:}
      hikari:
        maximum-pool-size: ${SIGA_DB_POOL_MAX:2}
        connection-timeout: ${SIGA_DB_CONN_TIMEOUT_MS:5000}
        max-lifetime: ${SIGA_DB_MAX_LIFETIME_MS:1500000}
        read-timeout: ${SIGA_DB_READ_TIMEOUT_MS:30000}
  # Senha única dos usuários de demonstração. Vazia = login desabilitado; o valor padrão só existe no perfil local.
  demo:
    senha: ${VISTAS_DEMO_SENHA:}
  sessao:
    duracao: PT8H
  dossie:
    diretorio: ${VISTAS_DOSSIE_DIRETORIO:/var/tmp/vistas}
    ttl-minutos: ${DOSSIE_TTL_MINUTOS:30}
    threads: ${DOSSIE_THREADS:2}
    download-timeout-segundos: ${DOWNLOAD_TIMEOUT_SEGUNDOS:120}
    download-total-maximo-segundos: ${DOWNLOAD_TOTAL_MAXIMO_SEGUNDOS:900}
    espaco-minimo-mb: ${DOSSIE_ESPACO_MINIMO_MB:2048}
    # Acima disto (MB) o download vai por ticket, em streaming, sem pré-visualização (S2.2).
    blob-max-mb: ${DOSSIE_BLOB_MAX_MB:150}
    # Horas que um pedido encerrado continua em "Dossiês gerados" depois do vencimento (S4; histórico em memória).
    historico-horas: ${DOSSIE_HISTORICO_HORAS:24}
    sumario: ${DOSSIE_SUMARIO:true}
    marcadores: ${DOSSIE_MARCADORES:true}
    numeracao: ${DOSSIE_NUMERACAO:true}
  # Conversão de planilhas, textos e imagens para PDF (S3). habilitada=false volta ao comportamento da S2.2.
  conversao:
    habilitada: ${CONVERSAO_HABILITADA:true}
    timeout-segundos: ${CONVERSAO_TIMEOUT_SEGUNDOS:300}
    processos: ${CONVERSAO_PROCESSOS:2}
    tarefas-por-processo: ${CONVERSAO_TAREFAS_POR_PROCESSO:50}
    planilha-modo: ${CONVERSAO_PLANILHA_MODO:LARGURA}
    abas-ocultas: ${CONVERSAO_ABAS_OCULTAS:false}
    imagem-max-megapixels: ${CONVERSAO_IMAGEM_MAX_MEGAPIXELS:100}
    # Planilhas no modo LARGURA: abaixo desta escala (%) a aba vai para uma página única, por legibilidade.
    planilha-escala-minima: ${CONVERSAO_PLANILHA_ESCALA_MINIMA:40}
    paginas-maximas: ${CONVERSAO_PAGINAS_MAXIMAS:2000}
    saida-max-mb: ${CONVERSAO_SAIDA_MAX_MB:500}
    # Pasta do LibreOffice (a que contém program/soffice). Vazia = localizar nos caminhos padrão.
    office-home: ${CONVERSAO_OFFICE_HOME:}
  # Modal de visualização (S3): cache da versão em PDF (em VISTAS_DOSSIE_DIRETORIO/visualizacao) e fila de conversões.
  visualizacao:
    ttl-minutos: ${VISUALIZACAO_TTL_MINUTOS:10}
    cache-max-mb: ${VISUALIZACAO_CACHE_MAX_MB:500}
    conversoes-simultaneas: ${VISUALIZACAO_CONVERSOES_SIMULTANEAS:2}
    fila-de-conversoes: ${VISUALIZACAO_FILA_CONVERSOES:4}
  # Geometrias em ZIP (S4): limites; temporários em VISTAS_DOSSIE_DIRETORIO/geometrias, com o espaço mínimo do dossiê.
  geometrias:
    max-mb: ${GEOMETRIAS_MAX_MB:500}
    max-arquivos: ${GEOMETRIAS_MAX_ARQUIVOS:200}
  # Auditoria em memória (S5): teto de eventos (saem os mais antigos) e retenção por grupo, em anos (1, 2, 5 ou 10).
  auditoria:
    max-eventos: ${AUDITORIA_MAX_EVENTOS:50000}
    retencao-documentos-anos: ${AUDITORIA_RETENCAO_DOCUMENTOS_ANOS:5}
    retencao-acessos-anos: ${AUDITORIA_RETENCAO_ACESSOS_ANOS:1}
    csv-max-linhas: ${AUDITORIA_CSV_MAX_LINHAS:50000}
  # API de arquivos do Licenciamento. URL vazia = não configurada: a geração falha com esse motivo, a listagem não.
  arquivos:
    url: ${LICENCIAMENTO_API_URL:}
    token: ${LICENCIAMENTO_API_TOKEN:}
    # Caminho de um arquivo com o token (S2.2): relido a cada pedido e tem precedência sobre o token acima.
    token-file: ${LICENCIAMENTO_API_TOKEN_FILE:}
    # bearer (padrão) ou cookie; vazio também vale como bearer.
    auth-mode: ${LICENCIAMENTO_API_AUTH_MODE:bearer}
    cookie-name: ${LICENCIAMENTO_API_COOKIE_NAME:}
  # SCORP (S4): documentos pessoais do interessado, dos representantes legais e dos responsáveis técnicos.
  # URL vazia = desligado (sem chamada e sem aviso). Autenticação NÃO CONFIRMADA (P06): sem as variáveis próprias,
  # usa as da API de arquivos (token-file, token, auth-mode, cookie-name).
  scorp:
    url: ${SCORP_API_URL:}
    token-file: ${SCORP_API_TOKEN_FILE:}
    auth-mode: ${SCORP_API_AUTH_MODE:}
    cookie-name: ${SCORP_API_COOKIE_NAME:}
    timeout-segundos: ${SCORP_TIMEOUT_SEGUNDOS:15}
    chamadas-simultaneas: ${SCORP_CHAMADAS_SIMULTANEAS:4}
    # false segue a Vista do SIGA (não sigiloso, R25); true trata todos como sigilosos. Decisão pendente (P30).
    sigilo-padrao: ${SCORP_SIGILO_PADRAO:false}
  # Origens de documento ligadas: as seis da seção "Arquivos do Processo" da Vista do SIGA (S2.1) e o SCORP (S4).
  documentos:
    origens:
      documento_processo: true
      documento_requerimento: true
      complementacao: true
      imovel: true
      representante_legal: true
      responsavel_tecnico: true
      # SCORP: desligado também quando SCORP_API_URL está vazia.
      scorp: true
  agendamento:
    enabled: ${AGENDAMENTO_ENABLED:true}
    limpeza-dossie: PT5M
    limpeza-orfaos: PT1H
