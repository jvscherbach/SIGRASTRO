# Configuração única de teste (L1, bloco 5): os três usuários padrão pelas mesmas propriedades da produção, com
# senhas óbvias de teste (cada uma diferente das outras, sem o login). O Gestor de teste é criado por GestorDeTeste.
# Estas propriedades têm precedência sobre o application.yml; as de @SpringBootTest(properties) vencem estas.
rastro.usuarios-padrao.operador.senha=senha-de-teste-op-01
rastro.usuarios-padrao.operador.cpf-cnpj=11.222.333/0001-81
rastro.usuarios-padrao.analista.senha=senha-de-teste-an-02
rastro.usuarios-padrao.admin.senha=senha-de-teste-ad-03
# Custo mínimo do PBKDF2 (faixa 100.000 a 2.000.000) para os testes não pagarem 600.000 iterações a cada login.
rastro.login.iteracoes=100000
